<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ダイナソー・ドミニオン</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #000;
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
    color: #e8eef5;
    display: flex;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255,106,0,.12), transparent 55%),
      linear-gradient(180deg, #11151c 0%, #0a0c10 45%, #06070a 100%);
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 0 50px rgba(255,106,0,.15);
  }

  /* ===== ヘッダー ===== */
  header {
    background: linear-gradient(180deg, #1c2330, #10141c);
    border-bottom: 2px solid #ff6a00;
    box-shadow: 0 2px 12px rgba(255,106,0,.25);
    padding: 8px 12px;
    position: sticky; top: 0; z-index: 10;
  }
  .player-row { display: flex; align-items: center; gap: 8px; }
  .lv-badge {
    background: linear-gradient(180deg, #ffd24a, #e08a00 55%, #ffb300);
    color: #3a2000; font-weight: 900; font-size: 12px;
    border-radius: 6px; padding: 3px 8px; white-space: nowrap;
    border: 1px solid #fff0b3;
    text-shadow: 0 1px 0 rgba(255,255,255,.4);
  }
  .res-chip {
    font-size: 12px; font-weight: bold;
    background: rgba(0,0,0,.5); border: 1px solid #3a455a;
    border-radius: 10px; padding: 3px 8px; white-space: nowrap;
  }
  .bars { margin-top: 6px; }
  .bar-label { font-size: 10px; color: #8fa3bd; display: flex; justify-content: space-between; margin-bottom: 2px; font-weight: bold; }
  .bar-outer {
    height: 10px; background: #05070b; border-radius: 5px;
    border: 1px solid #2a3547; overflow: hidden;
  }
  .bar-inner { height: 100%; border-radius: 5px; transition: width .3s; }
  .bar-stamina { background: linear-gradient(90deg, #35e05a, #0f9e3a); box-shadow: 0 0 6px rgba(53,224,90,.6); }
  .bar-exp { background: linear-gradient(90deg, #00d9ff, #0077ff); box-shadow: 0 0 6px rgba(0,217,255,.6); }

  /* ===== メイン ===== */
  main { flex: 1; overflow-y: auto; padding: 12px 12px 76px; }
  .panel {
    background: linear-gradient(180deg, rgba(20,26,36,.9), rgba(10,13,18,.9));
    border: 1px solid #2a3547;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
  }
  h2 {
    font-size: 15px; font-weight: 900; margin-bottom: 8px;
    background: linear-gradient(180deg, #ffe9a8, #ffb300);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.8));
  }
  .area-name {
    font-size: 18px; font-weight: 900; color: #fff;
    text-shadow: 0 0 10px rgba(255,106,0,.6), 0 2px 2px #000;
  }
  .area-desc { font-size: 11px; color: #8fa3bd; margin: 4px 0 10px; }

  .progress-outer {
    height: 20px; background: #05070b; border-radius: 10px;
    border: 1px solid #ff6a00; overflow: hidden; position: relative;
    box-shadow: inset 0 2px 4px rgba(0,0,0,.8);
  }
  .progress-inner {
    height: 100%;
    background: linear-gradient(90deg, #ff3d00, #ff6a00 50%, #ffb300);
    box-shadow: 0 0 10px rgba(255,106,0,.8);
    transition: width .3s;
  }
  .progress-text {
    position: absolute; inset: 0; text-align: center;
    font-size: 11px; font-weight: 900; line-height: 20px; color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }

  /* ===== 結果ドン！ステージ ===== */
  .stage {
    min-height: 150px;
    margin-top: 10px;
    border-radius: 12px;
    background:
      radial-gradient(ellipse at 50% 60%, rgba(0,217,255,.08), transparent 70%),
      linear-gradient(180deg, #0c1016, #05070a);
    border: 1px solid #2a3547;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 12px;
    overflow: hidden;
  }
  .stage-art { height: 72px; display: flex; align-items: center; justify-content: center; }
  .stage-art img { max-height: 72px; filter: drop-shadow(0 0 12px rgba(0,217,255,.5)); }
  .stage-art .dino-emoji { font-size: 54px; line-height: 1; filter: drop-shadow(0 0 10px rgba(0,217,255,.5)); }
  .stage-text {
    margin-top: 6px; font-size: 15px; font-weight: 900; line-height: 1.5;
    text-shadow: 0 2px 3px #000;
  }
  .stage-sub { font-size: 11px; color: #8fa3bd; margin-top: 2px; }
  .stage.bang > * { animation: bang .35s; }
  @keyframes bang {
    0% { transform: scale(.3); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  .c-dna  { color: #00d9ff; text-shadow: 0 0 8px rgba(0,217,255,.8), 0 2px 3px #000; }
  .c-coin { color: #ffd24a; text-shadow: 0 0 8px rgba(255,210,74,.6), 0 2px 3px #000; }
  .c-key  { color: #7ec8ff; text-shadow: 0 0 8px rgba(126,200,255,.6), 0 2px 3px #000; }
  .c-rare { color: #ffb300; text-shadow: 0 0 10px rgba(255,106,0,.9), 0 2px 3px #000; }
  .c-sys  { color: #9aa8b8; }

  /* ===== ボタン ===== */
  .btn {
    display: block; width: 100%;
    border: none; border-radius: 12px;
    font-family: inherit; font-weight: 900; color: #fff;
    cursor: pointer; text-align: center;
    transition: transform .05s;
  }
  .btn:active { transform: scale(.96); }
  .btn-explore {
    margin-top: 12px; padding: 16px;
    font-size: 19px;
    background: linear-gradient(180deg, #ffb300, #ff6a00 45%, #e23c00);
    border: 2px solid #ffd891; border-bottom-width: 4px;
    box-shadow: 0 0 16px rgba(255,106,0,.5), 0 4px 10px rgba(0,0,0,.6);
    text-shadow: 0 2px 2px rgba(120,30,0,.8);
  }
  .btn-explore:disabled {
    background: #2a3240; border-color: #455062; color: #6b7889;
    box-shadow: none; text-shadow: none; cursor: default;
  }
  .btn-boss {
    margin-top: 12px; padding: 16px; font-size: 19px;
    background: linear-gradient(180deg, #ff5a3c, #d41900 50%, #8a0a00);
    border: 2px solid #ffb3a0; border-bottom-width: 4px;
    text-shadow: 0 2px 2px rgba(80,0,0,.9);
    animation: pulse .9s infinite alternate;
  }
  @keyframes pulse { from { box-shadow: 0 0 8px rgba(255,61,0,.6); } to { box-shadow: 0 0 24px rgba(255,90,40,.9); } }
  .btn-sub {
    padding: 10px; font-size: 14px;
    background: linear-gradient(180deg, #46566b, #2b3647);
    border: 1px solid #6e85a3;
  }
  .btn-gold {
    padding: 12px; font-size: 15px;
    background: linear-gradient(180deg, #ffd24a, #e08a00 55%, #ffb300);
    border: 2px solid #fff0b3; border-bottom-width: 4px;
    color: #3a2000; text-shadow: 0 1px 0 rgba(255,255,255,.35);
  }
  .btn-gold:disabled { background: #2a3240; border-color: #455062; color: #6b7889; text-shadow: none; }

  /* エリア選択 */
  .area-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
  .area-tab {
    flex-shrink: 0; font-size: 11px; font-weight: bold;
    padding: 6px 10px; border-radius: 8px;
    background: rgba(0,0,0,.45); border: 1px solid #2a3547; color: #8fa3bd;
    font-family: inherit; cursor: pointer;
  }
  .area-tab.active {
    background: linear-gradient(180deg, #ff8a00, #e23c00); color: #fff;
    border-color: #ffd891; box-shadow: 0 0 8px rgba(255,106,0,.5);
  }
  .area-tab.locked { opacity: .4; cursor: default; }

  /* ===== トースト ===== */
  #toasts {
    position: fixed; top: 86px; left: 50%; transform: translateX(-50%);
    width: calc(100% - 32px); max-width: 448px; z-index: 40;
    display: flex; flex-direction: column; gap: 6px; pointer-events: none;
  }
  .toast {
    background: linear-gradient(180deg, rgba(20,26,36,.97), rgba(8,10,14,.97));
    border: 1px solid #ffb300; border-radius: 10px;
    padding: 8px 12px; font-size: 13px; font-weight: 900; text-align: center;
    box-shadow: 0 0 14px rgba(255,179,0,.4), 0 4px 10px rgba(0,0,0,.6);
    animation: toastin .25s;
  }
  .toast.out { animation: toastout .3s forwards; }
  @keyframes toastin { from { opacity: 0; transform: translateY(-12px) scale(.9); } to { opacity: 1; } }
  @keyframes toastout { to { opacity: 0; transform: translateY(-8px); } }

  /* ===== 恐竜の絵（画像 or 絵文字） ===== */
  .dino-art { height: 52px; display: flex; align-items: center; justify-content: center; }
  .dino-art img { max-width: 100%; max-height: 52px; }
  .dino-art .dino-emoji { font-size: 34px; line-height: 1; }
  .silhouette .dino-art img,
  .silhouette .dino-art .dino-emoji { filter: brightness(0) opacity(.7) drop-shadow(0 0 4px rgba(0,217,255,.35)); }

  /* ===== 図鑑 ===== */
  .dex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dino-card {
    background: linear-gradient(180deg, #141a24, #0a0d12);
    border-radius: 10px;
    border: 2px solid #2a3547; padding: 8px 4px; text-align: center;
    position: relative;
  }
  .dino-card.r-N  { border-color: #76828f; }
  .dino-card.r-R  { border-color: #00a8e8; box-shadow: 0 0 6px rgba(0,168,232,.3); }
  .dino-card.r-SR { border-color: #ffb300; box-shadow: 0 0 8px rgba(255,179,0,.4); }
  .dino-card.r-SSR {
    border-color: #ff3d00;
    box-shadow: 0 0 12px rgba(255,61,0,.55);
    background: linear-gradient(180deg, #241318, #0a0d12);
  }
  .dino-name { font-size: 10px; font-weight: bold; margin-top: 2px; min-height: 26px; }
  .dino-pow { font-size: 10px; color: #ffd24a; font-weight: bold; }
  .rarity-tag {
    position: absolute; top: 4px; left: 4px;
    font-size: 9px; font-weight: 900; border-radius: 4px; padding: 1px 5px;
    z-index: 1; color: #fff; text-shadow: 0 1px 1px rgba(0,0,0,.6);
  }
  .rt-N { background: #76828f; }
  .rt-R { background: linear-gradient(180deg, #00c3ff, #0077cc); }
  .rt-SR { background: linear-gradient(180deg, #ffd24a, #e08a00); color: #3a2000; text-shadow: none; }
  .rt-SSR { background: linear-gradient(180deg, #ff6a3c, #c41000); }
  .dna-mini { font-size: 9px; color: #00d9ff; margin-top: 2px; font-weight: bold; }
  .btn-restore {
    margin-top: 4px; font-size: 10px; padding: 4px 2px; border-radius: 6px;
    background: linear-gradient(180deg, #00d9ff, #0077ff);
    border: 1px solid #a8efff; width: 100%; color: #fff; font-weight: 900;
    font-family: inherit; cursor: pointer;
    animation: pulse-cyan 1s infinite alternate;
  }
  @keyframes pulse-cyan { from { box-shadow: 0 0 3px rgba(0,217,255,.5); } to { box-shadow: 0 0 10px rgba(0,217,255,.9); } }
  .team-mark { position: absolute; top: 4px; right: 4px; font-size: 11px; z-index: 1; }

  /* ===== 宝箱 ===== */
  .chest-stage { text-align: center; padding: 10px 0; }
  .chest-emoji { font-size: 72px; display: inline-block; filter: drop-shadow(0 0 14px rgba(255,179,0,.45)); }
  .chest-emoji.shake { animation: shake .5s; }
  @keyframes shake {
    0%,100% { transform: rotate(0); } 20% { transform: rotate(-12deg); }
    40% { transform: rotate(10deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(6deg); }
  }
  .gacha-result { margin-top: 10px; font-size: 14px; font-weight: 900; min-height: 96px; }
  .gacha-result .big-art { height: 64px; display: flex; align-items: center; justify-content: center; animation: bang .4s; }
  .gacha-result .big-art img { max-height: 64px; filter: drop-shadow(0 0 14px rgba(0,217,255,.6)); }
  .gacha-result .big-art .dino-emoji { font-size: 48px; filter: drop-shadow(0 0 12px rgba(0,217,255,.6)); }

  /* ===== バトルモーダル ===== */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,.88);
    z-index: 50; display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal {
    width: 100%; max-width: 448px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,61,0,.18), transparent 60%),
      linear-gradient(180deg, #161018, #0a0709);
    border: 2px solid #ff3d00; border-radius: 16px; padding: 16px;
    box-shadow: 0 0 30px rgba(255,61,0,.4);
    text-align: center;
  }
  .boss-title {
    font-size: 16px; font-weight: 900; color: #ff8a65;
    text-shadow: 0 0 10px rgba(255,61,0,.8), 0 2px 2px #000;
  }
  .boss-art { height: 110px; display: flex; align-items: center; justify-content: center; animation: bossfloat 1.5s infinite alternate; }
  .boss-art img { max-height: 110px; filter: drop-shadow(0 0 16px rgba(255,61,0,.6)); }
  .boss-art .dino-emoji { font-size: 80px; filter: drop-shadow(0 0 14px rgba(255,61,0,.6)); }
  @keyframes bossfloat { from { transform: translateY(0); } to { transform: translateY(-8px); } }
  .boss-art.hit { animation: hitflash .25s; }
  @keyframes hitflash { 0% { filter: brightness(3); transform: scale(.92); } 100% { filter: none; } }
  .bar-boss { background: linear-gradient(90deg, #ff3d00, #a01000); box-shadow: 0 0 8px rgba(255,61,0,.7); }
  .bar-php  { background: linear-gradient(90deg, #35e05a, #0f9e3a); box-shadow: 0 0 6px rgba(53,224,90,.6); }
  .battle-log { font-size: 13px; font-weight: 900; min-height: 38px; margin: 8px 0; color: #ffd24a; text-shadow: 0 1px 2px #000; }
  .dmg-pop {
    position: fixed; font-weight: 900; color: #ffec8a; font-size: 24px;
    pointer-events: none; animation: dmgfly .6s forwards;
    text-shadow: 0 0 8px rgba(255,106,0,.9), 0 2px 4px #000; z-index: 60;
  }
  @keyframes dmgfly { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }

  /* ===== フッターナビ ===== */
  nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    display: flex; z-index: 20;
    background: linear-gradient(180deg, #1c2330, #0c0f15);
    border-top: 2px solid #ff6a00;
    box-shadow: 0 -2px 12px rgba(255,106,0,.2);
  }
  nav > button {
    flex: 1; background: none; border: none; color: #6b7889;
    font-family: inherit; font-size: 11px; font-weight: 900;
    padding: 8px 0 max(8px, env(safe-area-inset-bottom)); cursor: pointer;
  }
  nav > button .nav-ico { display: block; font-size: 20px; }
  nav > button.active { color: #ffb300; text-shadow: 0 0 8px rgba(255,179,0,.7); }
  .nav-badge { color: #ff3d00; }

  .hidden { display: none !important; }
  .center { text-align: center; }
  .small { font-size: 11px; color: #8fa3bd; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="player-row">
      <span class="lv-badge">Lv <span id="h-level">1</span></span>
      <span class="res-chip">🪙 <span id="h-coins">0</span></span>
      <span class="res-chip">🗝️ <span id="h-keys">0</span></span>
      <span class="res-chip">💪 <span id="h-power">0</span></span>
    </div>
    <div class="bars">
      <div class="bar-label"><span>スタミナ</span><span id="h-stamina-text">100/100</span></div>
      <div class="bar-outer"><div id="h-stamina-bar" class="bar-inner bar-stamina" style="width:100%"></div></div>
      <div class="bar-label" style="margin-top:4px"><span>EXP</span><span id="h-exp-text">0/100</span></div>
      <div class="bar-outer" style="height:6px"><div id="h-exp-bar" class="bar-inner bar-exp" style="width:0%"></div></div>
    </div>
  </header>

  <div id="toasts"></div>

  <main>
    <!-- ===== 探索タブ ===== -->
    <section id="tab-explore">
      <div class="area-tabs" id="area-tabs"></div>
      <div class="panel">
        <div class="area-name" id="area-name"></div>
        <div class="area-desc" id="area-desc"></div>
        <div class="progress-outer">
          <div class="progress-inner" id="area-progress" style="width:0%"></div>
          <div class="progress-text" id="area-progress-text">0%</div>
        </div>

        <div class="stage" id="stage">
          <div class="stage-art" id="stage-art">🌴</div>
          <div class="stage-text" id="stage-text">探索ボタンを押して<br>恐竜のDNAを探そう！</div>
          <div class="stage-sub" id="stage-sub"></div>
        </div>

        <button class="btn btn-explore" id="btn-explore" onclick="explore()">🔍 探索する（スタミナ-5）</button>
        <button class="btn btn-boss hidden" id="btn-boss" onclick="openBattle()">⚔️ ボスに挑む！</button>
      </div>
    </section>

    <!-- ===== 図鑑タブ ===== -->
    <section id="tab-dex" class="hidden">
      <div class="panel">
        <h2>🦖 恐竜図鑑 <span class="small">（<span id="dex-count">0</span>/<span id="dex-total">0</span>体 復元済み）</span></h2>
        <div class="small" style="margin-bottom:8px">DNAを集めて恐竜を復元しよう。パワー上位3体がバトルチーム（⭐）になるよ。復元後に拾ったDNAは自動でパワーに変わる！</div>
        <div class="dex-grid" id="dex-grid"></div>
      </div>
    </section>

    <!-- ===== 宝箱タブ ===== -->
    <section id="tab-chest" class="hidden">
      <div class="panel chest-stage">
        <h2>🎁 なぞの宝箱</h2>
        <div class="small">探索で拾った鍵で開けよう。レアDNAが眠っているかも…！</div>
        <div style="margin:10px 0"><span class="chest-emoji" id="chest-emoji">🧰</span></div>
        <div class="gacha-result" id="gacha-result"><span class="small">所持している鍵：<span id="chest-keys">0</span>本</span></div>
        <button class="btn btn-gold" id="btn-open-chest" onclick="openChest()">🗝️ 宝箱を開ける（鍵1本）</button>
        <button class="btn btn-sub" style="margin-top:8px" id="btn-buy-key" onclick="buyKey()">🪙 500コインで鍵を1本買う</button>
      </div>
      <div class="panel">
        <h2>📦 出現率</h2>
        <div class="small">
          N のDNA … 55%　／　R のDNA … 30%<br>
          SR のDNA … 12%　／　<span class="c-rare">SSR のDNA … 3%</span>
        </div>
      </div>
      <div class="panel center">
        <button class="btn btn-sub" id="btn-reset" onclick="resetGame()">データをはじめから</button>
      </div>
    </section>
  </main>

  <!-- ===== バトルモーダル ===== -->
  <div class="modal-bg hidden" id="battle-modal">
    <div class="modal">
      <div class="boss-title" id="b-boss-name"></div>
      <div class="boss-art" id="b-boss-art"></div>
      <div class="bar-label"><span>ボスHP</span><span id="b-boss-hp-text"></span></div>
      <div class="bar-outer"><div class="bar-inner bar-boss" id="b-boss-hp-bar" style="width:100%"></div></div>
      <div class="bar-label" style="margin-top:8px"><span>チームHP</span><span id="b-php-text"></span></div>
      <div class="bar-outer"><div class="bar-inner bar-php" id="b-php-bar" style="width:100%"></div></div>
      <div class="battle-log" id="b-log">たたかえ！</div>
      <button class="btn btn-explore" id="btn-attack" onclick="attack()">⚔️ こうげき！</button>
      <button class="btn btn-sub" style="margin-top:8px" onclick="fleeBattle()">にげる</button>
    </div>
  </div>

  <nav>
    <button id="nav-explore" class="active" onclick="switchTab('explore')"><span class="nav-ico">🔍</span>探索</button>
    <button id="nav-dex" onclick="switchTab('dex')"><span class="nav-ico">🦖</span>図鑑<span class="nav-badge hidden" id="badge-dex">●</span></button>
    <button id="nav-chest" onclick="switchTab('chest')"><span class="nav-ico">🎁</span>宝箱<span class="nav-badge hidden" id="badge-chest">●</span></button>
  </nav>
</div>

<script>
/* ========== マスターデータ ========== */
const DINOS = [
  { id:'compso',  name:'コンプソグナトゥス', emoji:'🦎', rarity:'N',  need:5,  pow:20 },
  { id:'ovi',     name:'オヴィラプトル',     emoji:'🥚', rarity:'N',  need:5,  pow:25 },
  { id:'para',    name:'パラサウロロフス',   emoji:'🦕', rarity:'N',  need:6,  pow:30 },
  { id:'stego',   name:'ステゴサウルス',     emoji:'🦕', rarity:'N',  need:6,  pow:35 },
  { id:'raptor',  name:'ヴェロキラプトル',   emoji:'🦖', rarity:'R',  need:10, pow:60 },
  { id:'tri',     name:'トリケラトプス',     emoji:'🦏', rarity:'R',  need:10, pow:70 },
  { id:'anky',    name:'アンキロサウルス',   emoji:'🐢', rarity:'R',  need:12, pow:80 },
  { id:'ptera',   name:'プテラノドン',       emoji:'🦅', rarity:'R',  need:12, pow:90 },
  { id:'carno',   name:'カルノタウルス',     emoji:'🦖', rarity:'SR', need:18, pow:150 },
  { id:'spino',   name:'スピノサウルス',     emoji:'🐊', rarity:'SR', need:20, pow:180 },
  { id:'brachio', name:'ブラキオサウルス',   emoji:'🦕', rarity:'SR', need:20, pow:190 },
  { id:'mosa',    name:'モササウルス',       emoji:'🐋', rarity:'SR', need:20, pow:200 },
  { id:'trex',    name:'ティラノサウルス',   emoji:'🦖', rarity:'SSR', need:30, pow:400 },
];
const DINO_MAP = Object.fromEntries(DINOS.map(d => [d.id, d]));

const AREAS = [
  { name:'ジャングルの入口', desc:'生い茂る木々の間に小型恐竜の気配がする…', icon:'🌴',
    pool:['compso','ovi','para'], rare:['raptor'],
    boss:{ name:'ボス・ラプトル', dino:'raptor', hp:300, atk:10 } },
  { name:'霧の湿地帯', desc:'深い霧の向こうから重い足音が聞こえる…', icon:'🌫️',
    pool:['para','stego','raptor'], rare:['tri'],
    boss:{ name:'あばれトリケラ', dino:'tri', hp:650, atk:14 } },
  { name:'灼熱の火山帯', desc:'マグマのそばは凶暴な肉食恐竜のなわばりだ！', icon:'🌋',
    pool:['stego','raptor','tri','anky'], rare:['carno','brachio'],
    boss:{ name:'炎のカルノ', dino:'carno', hp:1300, atk:18 } },
  { name:'嵐の海岸', desc:'荒れ狂う海に巨大な影が泳いでいる…', icon:'🌊',
    pool:['anky','ptera','carno'], rare:['spino','mosa'],
    boss:{ name:'海帝モサ', dino:'mosa', hp:2600, atk:24 } },
  { name:'禁断の孤島', desc:'ここが最後の地。王者が君を待っている。', icon:'🏝️',
    pool:['ptera','carno','spino','brachio','mosa'], rare:['trex'],
    boss:{ name:'キング・ティラノ', dino:'trex', hp:5000, atk:32 } },
];

const STAMINA_COST = 5;
const STAMINA_REGEN_MS = 20000; // 20秒で1回復
const RARITY_NAME = { N:'ノーマル', R:'レア', SR:'Sレア', SSR:'SSレア' };
const RARITY_COLOR = { N:'#aab4bf', R:'#00c3ff', SR:'#ffb300', SSR:'#ff3d00' };

/* ========== 恐竜の絵（images/xxx.png があれば画像、なければ絵文字） ========== */
const IMG_FAIL = new Set(); // 読み込みに失敗したid（絵文字で代用）
function dinoArtHTML(id) {
  const d = DINO_MAP[id];
  if (IMG_FAIL.has(id)) return `<div class="dino-emoji">${d.emoji}</div>`;
  return `<img src="images/${id}.png" alt="${d.name}" data-id="${id}" data-emoji="${d.emoji}" onerror="imgFallback(this)">`;
}
function imgFallback(img) {
  IMG_FAIL.add(img.dataset.id);
  const span = document.createElement('div');
  span.className = 'dino-emoji';
  span.textContent = img.dataset.emoji;
  img.replaceWith(span);
}

/* ========== セーブデータ ========== */
let S = null;
function defaultSave() {
  return {
    level: 1, exp: 0,
    stamina: 100, maxStamina: 100, lastStamina: Date.now(),
    coins: 0, keys: 1,
    dna: {},            // id -> 所持DNA数
    restored: {},       // id -> 追加パワー（強化分）
    areaIdx: 0,
    progress: AREAS.map(() => 0),
    cleared: AREAS.map(() => false),
    bossReady: AREAS.map(() => false),
  };
}
function save() { localStorage.setItem('dinoDominionSave', JSON.stringify(S)); }
function load() {
  let fresh = false;
  try {
    const raw = localStorage.getItem('dinoDominionSave');
    S = raw ? Object.assign(defaultSave(), JSON.parse(raw)) : null;
  } catch (e) { S = null; }
  if (!S) { S = defaultSave(); fresh = true; }
  if (fresh) {
    S.restored['compso'] = 0; // スターター恐竜
    save();
    setTimeout(() => {
      showStage(dinoArtHTML('compso'),
        '<span class="c-rare">最初の相棒<br>コンプソグナトゥスを手に入れた！</span>',
        '探索ボタンを押してDNAを集めよう');
    }, 100);
  }
}

/* ========== ユーティリティ ========== */
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function expNeed() { return S.level * 100; }

function dinoPower(id) { return DINO_MAP[id].pow + (S.restored[id] || 0); }
function teamIds() {
  return Object.keys(S.restored).sort((a, b) => dinoPower(b) - dinoPower(a)).slice(0, 3);
}
function teamPower() { return teamIds().reduce((sum, id) => sum + dinoPower(id), 0); }

/* ========== 結果ドン！ステージ ========== */
function showStage(artHTML, textHTML, subText) {
  const stage = document.getElementById('stage');
  document.getElementById('stage-art').innerHTML = artHTML;
  document.getElementById('stage-text').innerHTML = textHTML;
  document.getElementById('stage-sub').textContent = subText || '';
  stage.classList.remove('bang'); void stage.offsetWidth; stage.classList.add('bang');
}

/* ========== トースト ========== */
function toast(msg) {
  const box = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = msg;
  box.appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, 2200);
  while (box.children.length > 3) box.firstChild.remove();
}

/* ========== スタミナ回復 ========== */
function tickStamina() {
  const now = Date.now();
  if (S.stamina >= S.maxStamina) { S.lastStamina = now; return; }
  const gained = Math.floor((now - S.lastStamina) / STAMINA_REGEN_MS);
  if (gained > 0) {
    S.stamina = Math.min(S.maxStamina, S.stamina + gained);
    S.lastStamina = S.stamina >= S.maxStamina ? now : S.lastStamina + gained * STAMINA_REGEN_MS;
    save();
  }
}

/* ========== EXP・レベル ========== */
function gainExp(n) {
  S.exp += n;
  while (S.exp >= expNeed()) {
    S.exp -= expNeed();
    S.level++;
    S.maxStamina += 5;
    S.stamina = S.maxStamina;
    toast(`🎉 <span class="c-rare">レベルアップ！ Lv${S.level}</span>　スタミナ全回復＆最大値UP！`);
  }
}

/* ========== DNA獲得 ========== */
/* 戻り値: ステージ表示用の{art, text, sub}（呼び出し側が表示を担当） */
function gainDna(id, n) {
  const d = DINO_MAP[id];
  if (S.restored[id] !== undefined) {
    S.restored[id] += n * 2; // 復元済みは強化に変換
    return {
      art: dinoArtHTML(id),
      text: `<span class="c-dna">🧬 ${d.name}のDNA ×${n}</span><br>パワー +${n * 2}！`,
      sub: `現在のパワー ${dinoPower(id)}`,
    };
  }
  S.dna[id] = (S.dna[id] || 0) + n;
  const rareTag = d.rarity === 'N' ? '' : `【${RARITY_NAME[d.rarity]}】`;
  const cls = (d.rarity === 'SR' || d.rarity === 'SSR') ? 'c-rare' : 'c-dna';
  if (S.dna[id] >= d.need) {
    toast(`✨ <span class="c-rare">${d.name}のDNAが揃った！図鑑で復元しよう！</span>`);
    document.getElementById('badge-dex').classList.remove('hidden');
  }
  return {
    art: dinoArtHTML(id),
    text: `<span class="${cls}">🧬 ${rareTag}${d.name}の<br>DNAを発見！</span>`,
    sub: `DNA ${S.dna[id]}/${d.need}`,
  };
}

/* ========== 探索 ========== */
const FLAVOR = [
  'あたりを調べたが何もなかった…',
  '恐竜の足あとを見つけた。近くにいるぞ…！',
  '古代のシダ植物が生い茂っている。',
  '遠くで恐竜の鳴き声がした！',
  '化石のかけらを見つけたが、崩れてしまった…',
];
function explore() {
  tickStamina();
  if (S.stamina < STAMINA_COST) {
    showStage('💤', '<span class="c-sys">スタミナが足りない…</span>', '20秒で1回復するよ。少し待とう！');
    renderAll(); return;
  }
  const ai = S.areaIdx;
  if (S.bossReady[ai]) { renderAll(); return; }

  if (S.stamina >= S.maxStamina) S.lastStamina = Date.now(); // 満タンから減り始めた瞬間に回復タイマー開始
  S.stamina -= STAMINA_COST;
  const area = AREAS[ai];

  S.progress[ai] = Math.min(100, S.progress[ai] + rand(4, 8));
  gainExp(rand(8, 15));

  const r = Math.random() * 100;
  if (r < 40) {
    const isRare = Math.random() < 0.15 && area.rare.length > 0;
    const res = gainDna(isRare ? pick(area.rare) : pick(area.pool), 1);
    showStage(res.art, res.text, res.sub);
  } else if (r < 60) {
    const c = rand(20, 60);
    S.coins += c;
    showStage('🪙', `<span class="c-coin">${c}コインを拾った！</span>`, `所持コイン ${S.coins}`);
  } else if (r < 70) {
    S.keys++;
    showStage('🗝️', '<span class="c-key">宝箱の鍵を見つけた！</span>', '宝箱タブで開けてみよう！');
    document.getElementById('badge-chest').classList.remove('hidden');
  } else if (r < 75) {
    const c = rand(80, 150);
    S.coins += c;
    showStage('💰', `<span class="c-rare">お宝ザクザク！<br>${c}コイン獲得！</span>`, `所持コイン ${S.coins}`);
  } else {
    showStage(area.icon, `<span class="c-sys">${pick(FLAVOR)}</span>`, '');
  }

  if (S.progress[ai] >= 100) {
    S.bossReady[ai] = true;
    toast(`⚠️ <span class="c-rare">${area.boss.name} が現れた！！</span>`);
  }
  save();
  renderAll();
}

/* ========== ボスバトル ========== */
let battle = null;
function openBattle() {
  const area = AREAS[S.areaIdx];
  const tp = teamPower();
  if (tp <= 0) { toast('⚠️ 恐竜がいない！図鑑でDNAから復元しよう！'); return; }
  battle = {
    bossHp: area.boss.hp, bossMax: area.boss.hp,
    php: 100 + S.level * 10, phpMax: 100 + S.level * 10,
  };
  document.getElementById('b-boss-name').textContent = `${area.boss.name}（${area.name}）`;
  document.getElementById('b-boss-art').innerHTML = dinoArtHTML(area.boss.dino);
  document.getElementById('b-log').textContent = `チームパワー ${tp} でたたかえ！`;
  document.getElementById('btn-attack').disabled = false;
  document.getElementById('battle-modal').classList.remove('hidden');
  renderBattle();
}
function renderBattle() {
  document.getElementById('b-boss-hp-text').textContent = `${Math.max(0, battle.bossHp)}/${battle.bossMax}`;
  document.getElementById('b-boss-hp-bar').style.width = Math.max(0, battle.bossHp / battle.bossMax * 100) + '%';
  document.getElementById('b-php-text').textContent = `${Math.max(0, battle.php)}/${battle.phpMax}`;
  document.getElementById('b-php-bar').style.width = Math.max(0, battle.php / battle.phpMax * 100) + '%';
}
function attack() {
  if (!battle) return;
  const area = AREAS[S.areaIdx];
  const dmg = Math.max(1, Math.round(teamPower() * (0.9 + Math.random() * 0.4)));
  battle.bossHp -= dmg;

  // ダメージ演出
  const art = document.getElementById('b-boss-art');
  art.classList.remove('hit'); void art.offsetWidth; art.classList.add('hit');
  const pop = document.createElement('div');
  pop.className = 'dmg-pop';
  pop.textContent = dmg;
  const rect = art.getBoundingClientRect();
  pop.style.left = (rect.left + rect.width / 2 - 20 + rand(-20, 20)) + 'px';
  pop.style.top = (rect.top + rand(-10, 10)) + 'px';
  document.body.appendChild(pop);
  setTimeout(() => pop.remove(), 600);

  if (battle.bossHp <= 0) { winBattle(); return; }

  const bossDmg = rand(Math.round(area.boss.atk * 0.7), Math.round(area.boss.atk * 1.3));
  battle.php -= bossDmg;
  document.getElementById('b-log').textContent = `${dmg}ダメージ！ ${area.boss.name}の反撃で ${bossDmg} くらった！`;
  if (battle.php <= 0) { loseBattle(); return; }
  renderBattle();
}
function winBattle() {
  const ai = S.areaIdx;
  const area = AREAS[ai];
  renderBattle();
  document.getElementById('btn-attack').disabled = true;
  document.getElementById('b-log').textContent = `🎉 ${area.boss.name} を倒した！！`;

  const coinReward = 200 * (ai + 1);
  S.coins += coinReward;
  S.keys += 2;
  toast(`🏆 <span class="c-rare">${area.boss.name} 撃破！</span>　${coinReward}コイン＆鍵2本ゲット！`);
  if (!S.cleared[ai]) {
    S.cleared[ai] = true;
    if (ai + 1 < AREAS.length) {
      toast(`🗺️ <span class="c-rare">新エリア「${AREAS[ai + 1].name}」解放！</span>`);
    } else {
      toast('👑 <span class="c-rare">全エリア制覇！！きみこそ恐竜王だ！！</span>');
    }
  }
  let stageRes = null;
  if (area.rare.length) stageRes = gainDna(pick(area.rare), 2); // ボスからレアDNAドロップ
  S.progress[ai] = 0;
  S.bossReady[ai] = false;
  gainExp(50 * (ai + 1));
  save();
  setTimeout(() => {
    closeBattle();
    if (stageRes) showStage(stageRes.art, '<span class="c-rare">ボスからのドロップ！</span><br>' + stageRes.text, stageRes.sub);
    else showStage('🏆', '<span class="c-rare">ボスを倒した！</span>', '');
  }, 1500);
}
function loseBattle() {
  renderBattle();
  document.getElementById('btn-attack').disabled = true;
  document.getElementById('b-log').textContent = '😵 やられた…恐竜を強化して再挑戦だ！';
  save();
  setTimeout(() => {
    closeBattle();
    showStage('💀', '<span class="c-sys">ボスに敗北…</span>', 'DNAを集めてパワーアップしよう');
  }, 1500);
}
function fleeBattle() { closeBattle(); }
function closeBattle() {
  battle = null;
  document.getElementById('battle-modal').classList.add('hidden');
  renderAll();
}

/* ========== 復元 ========== */
function restore(id) {
  const d = DINO_MAP[id];
  if ((S.dna[id] || 0) < d.need) return;
  const surplus = S.dna[id] - d.need;
  delete S.dna[id];
  S.restored[id] = surplus * 2; // 余りは強化に回す
  toast(`🧪 <span class="c-rare">復元成功！【${RARITY_NAME[d.rarity]}】${d.name} が仲間になった！</span>`);
  showStage(dinoArtHTML(id),
    `<span class="c-rare">復元成功！<br>${d.name} が仲間になった！</span>`,
    `パワー ${dinoPower(id)}`);
  save();
  renderAll();
}

/* ========== 宝箱 ========== */
let chestBusy = false;
function openChest() {
  if (chestBusy) return;
  if (S.keys < 1) {
    document.getElementById('gacha-result').innerHTML = '<span class="small">鍵がない…探索で見つけよう！</span>';
    return;
  }
  chestBusy = true;
  S.keys--;
  save();
  renderAll();
  const em = document.getElementById('chest-emoji');
  em.textContent = '🧰';
  em.classList.remove('shake'); void em.offsetWidth; em.classList.add('shake');
  document.getElementById('gacha-result').innerHTML = '<span class="small">ガタガタ…！</span>';

  setTimeout(() => {
    const r = Math.random() * 100;
    const rarity = r < 55 ? 'N' : r < 85 ? 'R' : r < 97 ? 'SR' : 'SSR';
    const d = pick(DINOS.filter(x => x.rarity === rarity));
    const amount = rarity === 'N' ? rand(2, 3) : rarity === 'R' ? rand(1, 2) : 1;
    em.textContent = '🎉';
    gainDna(d.id, amount);
    document.getElementById('gacha-result').innerHTML =
      `<div class="big-art">${dinoArtHTML(d.id)}</div>` +
      `<span style="color:${RARITY_COLOR[rarity]}">【${RARITY_NAME[rarity]}】${d.name}のDNA ×${amount}！</span>`;
    save();
    renderAll();
    chestBusy = false;
    setTimeout(() => { if (!chestBusy) em.textContent = '🧰'; }, 1200);
  }, 600);
}
function buyKey() {
  if (S.coins < 500) {
    document.getElementById('gacha-result').innerHTML = '<span class="small">コインが足りない…（500コイン必要）</span>';
    return;
  }
  S.coins -= 500;
  S.keys++;
  toast('🗝️ 500コインで鍵を買った！');
  save();
  renderAll();
}

/* ========== リセット（2回タップ方式） ========== */
let resetArmed = false;
function resetGame() {
  const btn = document.getElementById('btn-reset');
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = '⚠️ 本当に消す？もう一度タップで実行';
    setTimeout(() => { resetArmed = false; btn.textContent = 'データをはじめから'; }, 3000);
    return;
  }
  localStorage.removeItem('dinoDominionSave');
  location.reload();
}

/* ========== タブ ========== */
function switchTab(tab) {
  ['explore', 'dex', 'chest'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
    document.getElementById('nav-' + t).classList.toggle('active', t === tab);
  });
  if (tab === 'dex') document.getElementById('badge-dex').classList.add('hidden');
  if (tab === 'chest') document.getElementById('badge-chest').classList.add('hidden');
  renderAll();
}

/* ========== 描画 ========== */
function selectArea(i) {
  if (i > 0 && !S.cleared[i - 1]) return;
  S.areaIdx = i;
  const a = AREAS[i];
  showStage(a.icon, `<span class="c-sys">${a.name}にやってきた</span>`, a.desc);
  save();
  renderAll();
}

function renderHeader() {
  document.getElementById('h-level').textContent = S.level;
  document.getElementById('h-coins').textContent = S.coins;
  document.getElementById('h-keys').textContent = S.keys;
  document.getElementById('h-power').textContent = teamPower();
  document.getElementById('h-stamina-text').textContent = `${S.stamina}/${S.maxStamina}`;
  document.getElementById('h-stamina-bar').style.width = (S.stamina / S.maxStamina * 100) + '%';
  document.getElementById('h-exp-text').textContent = `${S.exp}/${expNeed()}`;
  document.getElementById('h-exp-bar').style.width = (S.exp / expNeed() * 100) + '%';
}

function updateExploreBtn() {
  const bossReady = S.bossReady[S.areaIdx];
  document.getElementById('btn-boss').classList.toggle('hidden', !bossReady);
  const exBtn = document.getElementById('btn-explore');
  exBtn.classList.toggle('hidden', bossReady);
  exBtn.disabled = S.stamina < STAMINA_COST;
  exBtn.textContent = S.stamina < STAMINA_COST
    ? '💤 スタミナ回復待ち…'
    : '🔍 探索する（スタミナ-5）';
}

function renderExplore() {
  const tabs = document.getElementById('area-tabs');
  tabs.innerHTML = '';
  AREAS.forEach((a, i) => {
    const locked = i > 0 && !S.cleared[i - 1];
    const b = document.createElement('button');
    b.className = 'area-tab' + (i === S.areaIdx ? ' active' : '') + (locked ? ' locked' : '');
    b.textContent = locked ? '🔒 ？？？' : (S.cleared[i] ? '✅ ' : '') + a.name;
    if (!locked) b.onclick = () => selectArea(i);
    tabs.appendChild(b);
  });

  const area = AREAS[S.areaIdx];
  document.getElementById('area-name').textContent = area.name;
  document.getElementById('area-desc').textContent = area.desc;
  document.getElementById('area-progress').style.width = S.progress[S.areaIdx] + '%';
  document.getElementById('area-progress-text').textContent = '探索率 ' + S.progress[S.areaIdx] + '%';
  updateExploreBtn();
}

function renderDex() {
  document.getElementById('dex-count').textContent = Object.keys(S.restored).length;
  document.getElementById('dex-total').textContent = DINOS.length;
  const grid = document.getElementById('dex-grid');
  grid.innerHTML = '';
  const team = teamIds();
  DINOS.forEach(d => {
    const owned = S.restored[d.id] !== undefined;
    const have = S.dna[d.id] || 0;
    const card = document.createElement('div');
    card.className = `dino-card r-${d.rarity}` + (owned ? '' : ' silhouette');
    let html = `<span class="rarity-tag rt-${d.rarity}">${d.rarity}</span>`;
    if (team.includes(d.id)) html += `<span class="team-mark">⭐</span>`;
    html += `<div class="dino-art">${dinoArtHTML(d.id)}</div>`;
    html += `<div class="dino-name">${owned ? d.name : '？？？'}</div>`;
    if (owned) {
      html += `<div class="dino-pow">💪 ${dinoPower(d.id)}</div>`;
    } else {
      html += `<div class="dna-mini">🧬 ${have}/${d.need}</div>`;
      if (have >= d.need) html += `<button class="btn-restore" onclick="restore('${d.id}')">復元する！</button>`;
    }
    card.innerHTML = html;
    grid.appendChild(card);
  });
}

function renderChest() {
  document.getElementById('chest-keys').textContent = S.keys;
  document.getElementById('btn-open-chest').disabled = S.keys < 1;
  document.getElementById('btn-buy-key').disabled = S.coins < 500;
}

function renderAll() {
  renderHeader();
  renderExplore();
  renderDex();
  renderChest();
}

/* ========== 起動 ========== */
load();
tickStamina();
renderAll();
// 毎秒：スタミナ回復チェック＋ヘッダーとボタンだけ更新（図鑑は画像チラつき防止のため触らない）
setInterval(() => { tickStamina(); renderHeader(); updateExploreBtn(); }, 1000);
</script>
</body>
